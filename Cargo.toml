[workspace]
members = [
    "oxyd-core",
]

# Se hai il frontend Next.js o altri file fuori dal workspace Rust
exclude = [
    "web-admin",
    "docs"
]

# Impostazioni comuni per i pacchetti membri
[workspace.package]
edition = "2024"
license = "MIT"
authors = ["Gabriele Giustizieri <gabryjust04@gmail.com>"]

# Risolutore moderno (per edition 2024)
resolver = "3"

# Dipendenze condivise (evita duplicazioni)
[workspace.dependencies]
# web
axum = "0.8.6"
tower = "0.5.2"
tower-http = { version = "0.5.2", features = ["trace", "cors"] }

# db
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }

# async
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

# auth / security
argon2 = "0.5"
jsonwebtoken = "8"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }

# utils
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1.0"
hex = "0.4"
regex = "1.12.2"


# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# cli
clap = { version = "4.5", features = ["derive"] }
inquire = "0.6"
